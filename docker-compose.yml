services:
  orchestrator:
    build: .
    container_name: orchestrator-app
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # redis removed
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp-itsm:
    build: .
    container_name: mcp-itsm
    env_file:
      - .env
    environment:
      - SNOW_URL
      - SNOW_USER
      - SNOW_PASS
    restart: unless-stopped
    command: uvicorn mcp_servers.itsm_server:mcp.sse_app --host 0.0.0.0 --port 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "-I", "http://localhost:3001/sse" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp-automation:
    build: .
    container_name: mcp-automation
    env_file:
      - .env
    environment:
      - AWX_URL
      - AWX_TOKEN
    restart: unless-stopped
    command: uvicorn mcp_servers.automation_server:mcp.sse_app --host 0.0.0.0 --port 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "-I", "http://localhost:3002/sse" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://host.docker.internal:11434/api/tags || exit 1"]
    #   interval: 20s
    #   timeout: 10s
    #   retries: 5

  postgres:
    image: postgres:15
    container_name: orchestrator-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    # redis_data removed

